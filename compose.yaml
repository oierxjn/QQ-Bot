services:
    webcontroller:
        image: heai/theresa-webcontroller:latest
        environment:
            THERESA_DEPLOY_DIR: ${THERESA_DEPLOY_DIR:?请先执行 scripts/setup_webcontroller.sh}
            THERESA_COMPOSE_PROJECT: ${THERESA_COMPOSE_PROJECT:?请先初始化面板项目名}
        ports:
            - "127.0.0.1:7001:7001"
        volumes:
            - type: bind
              source: ${THERESA_DEPLOY_DIR:?请先初始化面板}
              target: ${THERESA_DEPLOY_DIR:?请先初始化面板}
            - /var/run/docker.sock:/var/run/docker.sock
        restart: unless-stopped

    db:
        image: postgres:18
        environment:
            POSTGRES_PASSWORD: <password>
            POSTGRES_USER: postgres
            POSTGRES_DB: bot
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s
        volumes:
            - postgres_data:/var/lib/postgresql

    pmhq:
        image: linyuchen/pmhq:7.3.2
        privileged: true
        environment:
            - ENABLE_HEADLESS=true
            - AUTO_LOGIN_QQ=123456789
        volumes:
            - qq_volume:/root/.config/QQ
            - ./llbot_config:/app/llbot/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:13000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    llbot:
        image: linyuchen/llbot:7.12.15
        ports:
            - "3080:3080"
        environment:
            - PMHQ_HOST=pmhq
            - WEBUI_PORT=3080
        volumes:
            - qq_volume:/root/.config/QQ
            - ./llbot_config:/app/llbot/data
        depends_on:
            - pmhq
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "sh", "-c", "ps | grep '[n]ode'"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    theresa:
        image: heai/theresa:latest
        entrypoint: ["/bin/sh", "/app/theresa/scripts/entrypoint.sh"]
        command: ["python3", "/app/theresa/main.py"]
        volumes:
            - ./configs:/app/theresa/configs
            - qq_volume:/root/.config/QQ
            - ./llbot_config:/app/llbot/data
        depends_on:
            db:
                condition: service_healthy
            pmhq:
                condition: service_healthy
            llbot:
                condition: service_healthy

volumes:
    postgres_data:
    qq_volume:
